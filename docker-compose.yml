services:
  navidrome-dedupe:
    # Fertiges Image aus GitHub Actions. In Dockge/Portainer genuegt "Aktualisieren".
    image: ghcr.io/twil1ghtzone/navidrome-duplicate-tool:latest
    # Bei jedem "up" wird das Image neu gezogen. Ohne diese Zeile kann ein alter
    # lokaler Stand mit demselben Tag liegen bleiben und der Container startet
    # weiter mit der alten Version, obwohl laengst eine neue veroeffentlicht ist.
    # (Nur entfernen, wenn der Server bewusst ohne Internet starten koennen soll.)
    pull_policy: always
    # Statt "latest" kann auch fest auf eine Version gezeigt werden, z. B.
    # image: ghcr.io/twil1ghtzone/navidrome-duplicate-tool:v0.6.3
    container_name: navidrome-dedupe
    restart: unless-stopped
    user: "0:0"                          # wie Navidrome; sonst UID:GID von Navidrome eintragen
    ports:
      - "8085:8080"                      # UI: http://<server-ip>:8085
    environment:
      UI_USER: "admin"
      UI_PASSWORD: "BITTE-AENDERN"       # leer lassen = Passwort wird erzeugt und steht im Container-Log
    volumes:
      - ./data/navidrome:/data           # Navidrome-Datenordner (enthaelt navidrome.db)
      - /mnt/tank/music:/music           # Musik, read-write (gleicher Pfad wie bei Navidrome)
      - ./dedupe/config:/config
      - ./dedupe/backups:/backups
      - ./dedupe/trash:/trash              # Papierkorb, falls "verschieben statt loeschen" aktiv ist
    stop_grace_period: 120s
    labels:
      - com.centurylinklabs.watchtower.enable=true
