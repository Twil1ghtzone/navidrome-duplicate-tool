services:
  navidrome-dedupe:
    # Fertiges Image aus GitHub Actions: In Dockge/Portainer reicht "Aktualisieren" (= pull + recreate).
    image: ghcr.io/twil1ghtzone/navidrome-duplicate-tool:latest
    # Alternative ohne Registry (baut bei jedem "up" neu aus GitHub): image-Zeile entfernen und stattdessen
    # build: https://github.com/Twil1ghtzone/navidrome-duplicate-tool.git#main
    # pull_policy: build
    container_name: navidrome-dedupe
    restart: unless-stopped
    user: "0:0"                          # wie Navidrome; sonst UID:GID von Navidrome eintragen
    ports:
      - "8085:8080"                      # UI: http://<server-ip>:8085
    environment:
      UI_USER: "admin"
      UI_PASSWORD: "BITTE-AENDERN"       # leer lassen = Passwort wird erzeugt und steht im Container-Log
    volumes:
      - ./data/navidrome:/data           # Navidrome-Datenordner (enthaelt navidrome.db)
      - /mnt/tank/music:/music           # Musik, read-write (gleicher Pfad wie bei Navidrome)
      - ./dedupe/config:/config
      - ./dedupe/backups:/backups
      - ./dedupe/trash:/trash              # Papierkorb, falls "verschieben statt loeschen" aktiv ist
    stop_grace_period: 120s
    labels:
      - com.centurylinklabs.watchtower.enable=true
