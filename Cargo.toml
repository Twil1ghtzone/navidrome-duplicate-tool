[package]
name = "navidrome-dedupe"
version = "0.7.1"
edition = "2021"
description = "Web-UI zur sicheren Deduplizierung einer Navidrome-Bibliothek (MP3 neben FLAC und doppelte FLACs) mit vollstaendiger Uebernahme von Favoriten, Playlists und Historie"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio-util = { version = "0.7", features = ["io"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
